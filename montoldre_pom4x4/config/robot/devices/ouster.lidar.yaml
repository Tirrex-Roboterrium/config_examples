name: lidar
launch:
  - include:
      file: "$(find-pkg-share romea_lidar_meta_bringup)/profile/ouster_ros_driver.launch.py"
      arg:
        - name: ip
          value: "192.168.0.26"
        - name: port
          value: "0"
  - include:
      file: $(find-pkg-share romea_lidar_meta_bringup)/profile/gz_bridge.launch.py
      if: $(eval "'$(var mode)' == 'simulation_gazebo'")
configuration:
  manufacturer: ouster
  model: os
  version: 1
  rate: 10
  horizontal_resolution: 2048
  vertical_resolution: 32
location:
  parent_link: "base_link"
  xyz: [2.95, 0.0, 0.52]
  rpy: [0.0, 32.0, 0.0]
records:
  cloud: true
