/**:
  ros__parameters:
    # the statechart filename (without extension) to use in the package romea_control_switcher
    # (in the 'fsm' directory).
    # statechart: path
    statechart: path_task

    # the statechart options available depends on the choosen statechart
    statechart_options:
      work_exit_offset: 1.85
      work_enter_offset: -1.85
      raise_duration: 4.0
      lower_duration: 3.0

    # autostart: automatically start the state machine
    # enable_marker: if enabled, publish rviz marker
    # marker_frame: frame used for the marker
    autostart: true
    enable_implement: true
    enable_marker: true
    marker_frame: base_link

    implement_enabled: true
    implement_inverted: false
    implement_frame_id: implement_link
    implement_point: [-0.7, 0.0, 0.0]

    cmd_output:
      message_type: romea_mobile_base_msgs/TwoAxleSteeringCommand
      priority: 10
