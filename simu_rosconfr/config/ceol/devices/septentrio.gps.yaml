  #   if: $(eval "'$(var mode)' == 'live'")
  - include:
      file: "$(find-pkg-share romea_gps_meta_bringup)/profile/localisation_plugin.launch.py"
      arg:
        - name: wgs84_anchor_file_path
          value: $(var wgs84_anchor_file_path)
        - name: odom_topic
          value: /$(var robot_namespace)/base/controller/odom
  - include:
      file: $(find-pkg-share romea_gps_meta_bringup)/profile/gz_bridge.launch.py
      if: $(eval "'$(var mode)' == 'simulation_gazebo'")
configuration:
  manufacturer: septentrio
  model: asterx
  rate: 10
  dual_antenna: true
location:
  parent_link: "base_link"
  xyz: [0.0, 0.0, 1.2]
records:
  nmea_sentence: true
  gps_fix: false
  vel: false
